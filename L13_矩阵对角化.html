<style>

    --vecA:#2b6cb0; --vecB:#c53030;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
       color:var(--ink);background:var(--bg);line-height:1.6;}

  header.appbar{background:linear-gradient(90deg,#1e3a8a,#2b6cb0);color:#fff;
       padding:12px 20px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;

  /* 分解矩阵展示 */
  .mat-block{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:center;margin:8px 0 4px;}

  /* ── 练习模式 ── */
  .modebar{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;
       margin-bottom:14px;background:#fff;}
  .modebar button{border:none;border-radius:0;padding:8px 18px;font-size:13.5px;background:#fff;

  .quizhead{display:flex;align-items:center;justify-content:space-between;gap:10px;

  .stats{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums;}

  .qbody{font-size:14.5px;line-height:2;}
  .qbody .ans{display:inline-flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .qbody input.qin{width:74px;font-size:15px;padding:6px 7px;border:1px solid var(--line);

  .opts{display:flex;flex-direction:column;gap:8px;margin-top:8px;}

       border-radius:8px;cursor:pointer;font-size:14px;transition:.12s;}

  .feedback.ok{color:var(--green);font-weight:600;}
  .feedback.no{color:#c53030;font-weight:600;}

       font-size:12px;color:#718096;text-align:center;}

<body>
<header class="appbar">
  <h1>矩阵对角化</h1>
  <span class="sub">相似对角化 <math><mi class="bm">A</mi><mo>=</mo><mi class="bm">P</mi><mi>&#x39B;</mi><msup><mi class="bm">P</mi><mrow><mo>&#x2212;</mo><mn>1</mn></mrow></msup></math></span>
  <span class="tag">L13 · 线性代数</span>
  <a class="back" href="./index.html">← 工具箱</a>
</header>

<div class="wrap">
  <div class="desc">
    若 <math><mn>2</mn><mo>&#xD7;</mo><mn>2</mn></math> 矩阵 <math><mi class="bm">A</mi></math> 有两个线性无关的特征向量，则它<b>可相似对角化</b>：
    <div class="formula">
      <math display="block">
        <mi class="bm">A</mi><mo>=</mo>
        <mi class="bm">P</mi><mi>&#x39B;</mi><msup><mi class="bm">P</mi><mrow><mo>&#x2212;</mo><mn>1</mn></mrow></msup>
      </math>
    </div>
    其中 <math><mi class="bm">P</mi></math> 的<b>列是特征向量</b>，对角阵 <math><mi>&#x39B;</mi></math> 的对角元是对应的<b>特征值</b>。在特征向量基下，<math><mi class="bm">A</mi></math> 就是<b>沿各特征方向分别按 <math><msub><mi>&#x3BB;</mi><mn>1</mn></msub></math>、<math><msub><mi>&#x3BB;</mi><mn>2</mn></msub></math> 缩放</b>；也因此 <math><msup><mi class="bm">A</mi><mi>k</mi></msup><mo>=</mo><mi class="bm">P</mi><msup><mi>&#x39B;</mi><mi>k</mi></msup><msup><mi class="bm">P</mi><mrow><mo>&#x2212;</mo><mn>1</mn></mrow></msup></math>，求幂十分方便。
  </div>

  <div class="modebar">
    <button id="btnExplore" class="on">自由探索</button>
    <button id="btnPractice">练习</button>

      <span><i style="background:var(--vecA)"></i>特征方向 <math><msub><mi class="bm">v</mi><mn>1</mn></msub></math></span>
      <span><i style="background:var(--vecB)"></i>特征方向 <math><msub><mi class="bm">v</mi><mn>2</mn></msub></math></span>
    </div>
  </div>
  </div><!--/col-left-->

  <div class="col-right">
  <div class="card" id="quizCard" style="display:none;">

      <h2>练习 · 矩阵对角化</h2>

  <div class="card" id="exploreCard">
    <h2>矩阵 A 与它的对角化</h2>
    <div class="row" style="align-items:flex-start;">
      <span class="lbl">矩阵 <math><mi class="bm">A</mi></math>：</span>
      <div class="matrix-grid">
        <input class="mx" type="text" id="matA11" value="2">
        <input class="mx" type="text" id="matA12" value="1">
        <input class="mx" type="text" id="matA21" value="1">
        <input class="mx" type="text" id="matA22" value="2">
      </div>
    </div>
    <div class="row">
      <span class="lbl">示例：</span>
      <div class="presets">
        <button onclick="setMatrix(2,1,1,2)">对称阵</button>
        <button onclick="setMatrix(2,1,0,3)">可对角化(非对称)</button>
        <button onclick="setMatrix(2,1,0,2)">不可对角化(重根)</button>
      </div>
    </div>
    <div class="slider-row">
      <span class="lbl">幂次 <math><mi>k</mi></math>：</span>
      <input type="range" id="kSlider" min="1" max="5" step="1" value="1">
      <span id="kVal" style="font-variant-numeric:tabular-nums;min-width:16px;">1</span>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const container=document.getElementById("canvasContainer");

let matrix=[[2,1],[1,2]];
let kPow=1;
let mode="explore";
let quiz=null;
let size, origin, sf;
let RANGE=6;
const NICE=[6,8,10,12,15,20,25,30,40,50,60,80,100,150,200,300,500];
function tickStep(){ return RANGE<=8?1: RANGE<=15?2: RANGE<=30?5: RANGE<=60?10: RANGE<=150?25: RANGE<=300?50:100; }
function fitRange(M, e){
    let need=1;
    need=Math.max(need, Math.abs(M[0][0]),Math.abs(M[1][0]),Math.abs(M[0][1]),Math.abs(M[1][1]));
    if(e && e.real && e.lambdas){ e.lambdas.forEach(l=>{ need=Math.max(need,Math.abs(Math.pow(l,curK())))}); }
    need=need*1.15+0.3;
    for(const k of NICE){ if(k>=need) return k; }
    return NICE[NICE.length-1];
}

function resize(){
    size=Math.min(container.clientWidth, Math.round(window.innerHeight*0.6), 420);
    size=Math.max(size,300);
    const dpr=Math.min(2, window.devicePixelRatio||1);
    canvas.width=Math.round(size*dpr); canvas.height=Math.round(size*dpr);
    canvas.style.width=size+"px"; canvas.style.height=size+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    origin=size/2;
    updateDisplay();
}
window.addEventListener("resize",resize);

function toPixel(d){return {x:origin+d.x*sf, y:origin-d.y*sf};}

/* ── 线性代数工具 ── */
function matmul(A,B){
    const R=[[0,0],[0,0]];
    for(let i=0;i<2;i++)for(let j=0;j<2;j++)
        R[i][j]=A[i][0]*B[0][j]+A[i][1]*B[1][j];
    return R;
}
function matpow(A,k){ let R=[[1,0],[0,1]]; for(let i=0;i<k;i++) R=matmul(R,A); return R; }
function matinv(P){
    const det=P[0][0]*P[1][1]-P[0][1]*P[1][0];
    return [[P[1][1]/det,-P[0][1]/det],[-P[1][0]/det,P[0][0]/det]];
}
function apply(M,p){return [M[0][0]*p[0]+M[0][1]*p[1], M[1][0]*p[0]+M[1][1]*p[1]];}
function gcd(a,b){ a=Math.abs(a);b=Math.abs(b); while(b){[a,b]=[b,a%b];} return a; }
function near(x,y){ return Math.abs(x-y)<1e-6; }
function round2(x){ return Math.round(x*100)/100; }
function niceVec(v){
    let [x,y]=v;
    if(near(x,Math.round(x))&&near(y,Math.round(y))){
        x=Math.round(x); y=Math.round(y);
        const g=gcd(x,y)||1; x/=g; y/=g;
        if(x<0||(x===0&&y<0)){ x=-x; y=-y; }
        return [x,y];
    }
    return [round2(x),round2(y)];
}

// 2×2 特征分解：返回 {real, repeated, diagonalizable, lambdas, vecs, reason, complex?}
function eig(A){
    const a=A[0][0],b=A[0][1],c=A[1][0],d=A[1][1];
    const T=a+d, D=a*d-b*c, disc=T*T-4*D;
    function evec(l){
        let vx,vy;
        if(Math.abs(b)>1e-9){ vx=b; vy=l-a; }
        else if(Math.abs(c)>1e-9){ vx=l-d; vy=c; }
        else { if(Math.abs(a-l)<1e-9){ vx=1; vy=0; } else { vx=0; vy=1; } }
        if(ratOf(l)) return niceVec([vx,vy]);
        if(Math.abs(vx)>1e-12) return [1, vy/vx];
        return [0, 1];
    }
    if(disc < -1e-9){
        const re=round2(T/2), im=round2(Math.sqrt(-disc)/2);
        return {real:false, diagonalizable:false, complex:{re,im},
                reason:"特征方程没有实根（判别式小于 0），A 没有实特征值，不能对角化"};
    }
    if(Math.abs(disc)<=1e-9){
        const l=T/2;
        const scalar=Math.abs(b)<1e-9&&Math.abs(c)<1e-9&&Math.abs(a-d)<1e-9;
        if(scalar) return {real:true,repeated:true,diagonalizable:true,lambdas:[l,l],
                vecs:[[1,0],[0,1]],reason:"λ 是二重特征值，但 A=λE 本身就是对角阵，可对角化"};
        return {real:true,repeated:true,diagonalizable:false,lambdas:[l,l],
                vecs:[evec(l),null],
                reason:"λ 是二重特征值，但只能找到一个线性无关的特征向量，不可对角化"};
    }
    const s=Math.sqrt(disc), l1=(T+s)/2, l2=(T-s)/2;
    return {real:true,repeated:false,diagonalizable:true,lambdas:[l1,l2],
            vecs:[evec(l1),evec(l2)],reason:"两个不同的实特征值，必可对角化"};
}

/* ── 画布数学体 ── */
const CMFONT='"Cambria Math","STIX Two Math",serif';
function toMath(str,bold){
    let out="";
    for(const ch of str){
        const cp=ch.codePointAt(0);
        if(cp>=0x41&&cp<=0x5A) out+=String.fromCodePoint((bold?0x1D468:0x1D434)+(cp-0x41));
        else if(cp>=0x61&&cp<=0x7A){
            if(!bold&&ch==="h") out+="ℎ";
            else out+=String.fromCodePoint((bold?0x1D482:0x1D44E)+(cp-0x61));
        } else out+=ch;
    }
    return out;
}
function drawMathLabel(text,x,y,color,px,bold){
    px=px||16;
    ctx.save();
    ctx.font=`${px}px ${CMFONT}`;
    ctx.textAlign="left"; ctx.textBaseline="middle";
    ctx.lineJoin="round"; ctx.lineWidth=px*0.15; ctx.strokeStyle="rgba(255,255,255,.9)";
    const s=toMath(text,bold);
    ctx.strokeText(s,x,y);
    ctx.fillStyle=color; ctx.fillText(s,x,y);
    ctx.restore();
}

function drawAxes(){
    ctx.clearRect(0,0,size,size);
    ctx.strokeStyle="#eaeff6"; ctx.lineWidth=1;
    const st=tickStep();
    for(let k=-Math.floor(RANGE/st)*st;k<=RANGE;k+=st){
        const px=Math.round(origin+k*sf)+0.5, py=Math.round(origin+k*sf)+0.5;
        ctx.beginPath();ctx.moveTo(px,0);ctx.lineTo(px,size);ctx.stroke();
        ctx.beginPath();ctx.moveTo(0,py);ctx.lineTo(size,py);ctx.stroke();
    }
    const oc=Math.round(origin)+0.5;
    ctx.strokeStyle="#94a3b8"; ctx.fillStyle="#94a3b8"; ctx.lineWidth=1.5; ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(6,oc);ctx.lineTo(size-6,oc);
    ctx.moveTo(oc,size-6);ctx.lineTo(oc,6);
    ctx.stroke();
    const ah=7;
    ctx.beginPath();
    ctx.moveTo(size-6,oc); ctx.lineTo(size-6-ah,oc-ah*0.55); ctx.lineTo(size-6-ah,oc+ah*0.55); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(oc,6); ctx.lineTo(oc-ah*0.55,6+ah); ctx.lineTo(oc+ah*0.55,6+ah); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#a0aec0"; ctx.font='11px "Segoe UI",system-ui'; ctx.textAlign="center"; ctx.textBaseline="top";
    for(let k=-Math.floor(RANGE/st)*st;k<=RANGE;k+=st){ if(k===0||Math.abs(k)>RANGE-0.5*st)continue; ctx.fillText(k, origin+k*sf, origin+5); }
    ctx.textAlign="left"; ctx.textBaseline="middle";
    for(let k=-Math.floor(RANGE/st)*st;k<=RANGE;k+=st){ if(k===0||Math.abs(k)>RANGE-0.5*st)continue; ctx.fillText(k, origin+5, origin-k*sf); }
    drawMathLabel("x", size-16, oc+13, "#64748b", 16);
    drawMathLabel("y", oc+11, 15, "#64748b", 16);
    drawMathLabel("O", oc-13, oc+11, "#64748b", 15, true);
}

function drawDeformedGrid(M){
    ctx.save();
    ctx.strokeStyle="rgba(43,108,176,0.32)"; ctx.lineWidth=1.2;
    const R=6;
    const seg=(p0,p1)=>{
        const a=apply(M,p0), b=apply(M,p1);
        const A=toPixel({x:a[0],y:a[1]}), B=toPixel({x:b[0],y:b[1]});
        ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();
    };
    for(let i=-R;i<=R;i++){ seg([i,-R],[i,R]); seg([-R,i],[R,i]); }
    ctx.restore();
}

function drawEigenLine(v,color){
    const n=Math.hypot(v[0],v[1]); if(n<1e-9)return;
    const u=[v[0]/n,v[1]/n], far=RANGE*1.6;
    const p1=toPixel({x:u[0]*far,y:u[1]*far}), p2=toPixel({x:-u[0]*far,y:-u[1]*far});
    ctx.save(); ctx.strokeStyle=color; ctx.globalAlpha=0.35; ctx.lineWidth=1.5; ctx.setLineDash([6,5]);
    ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke(); ctx.restore();
}

function drawArrowData(d,color,width,label){
    const p=toPixel(d);
    const dx=p.x-origin, dy=p.y-origin, len=Math.hypot(dx,dy);
    ctx.save();
    ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=width; ctx.lineCap="round"; ctx.lineJoin="round";
    if(len>2){
        const ang=Math.atan2(dy,dx);
        const head=Math.min(15, Math.max(9, len*0.2)), hw=head*0.42;
        const bx=origin+Math.cos(ang)*(len-head*0.85), by=origin+Math.sin(ang)*(len-head*0.85);
        ctx.beginPath(); ctx.moveTo(origin,origin); ctx.lineTo(bx,by); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(p.x,p.y);
        ctx.lineTo(p.x-head*Math.cos(ang)+hw*Math.sin(ang), p.y-head*Math.sin(ang)-hw*Math.cos(ang));
        ctx.lineTo(p.x-head*Math.cos(ang)-hw*Math.sin(ang), p.y-head*Math.sin(ang)+hw*Math.cos(ang));
        ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    if(label && len>2){
        const ang=Math.atan2(dy,dx);
        drawMathLabel(label, p.x+10*Math.cos(ang)+(dx<0?-6:4), p.y+10*Math.sin(ang)-6, color, 15, false);
    }
}

function fmt(n){ if(!isFinite(n))return "∞"; const r=Math.round(n*100)/100; return (Object.is(r,-0)?0:r).toString(); }

function curK(){ return mode==="practice"?1:kPow; }
function updateDisplay(){
    const A0 = (mode==="practice"&&quiz)? quiz.A : matrix;
    const k=curK();
    const M=matpow(A0,k);
    const e=eig(A0);
    RANGE=fitRange(M,e); sf=size/(2*RANGE);
    drawAxes();
    // 练习：揭晓前不画会泄露答案的部分
    const pr = mode==="practice" && quiz;
    const showGrid = !pr || quiz.revealed || quiz.kind!=="element";       // 求元素题：网格即 A 的列，揭晓前不画
    const showEig  = !pr || quiz.revealed || quiz.kind==="element";       // 求特征值/判断题：特征方向揭晓前不画
    if(showGrid) drawDeformedGrid(M);
    if(pr) drawPracticeNote();
    if(!showEig){ if(!pr) renderDecomp(e); return; }
    if(e.real && e.diagonalizable){
        const cols=["var(--vecA)","var(--vecB)"];
        for(let i=0;i<2;i++){
            const v=e.vecs[i]; if(!v)continue;
            const n=Math.hypot(v[0],v[1]); if(n<1e-9)continue;
            const u=[v[0]/n,v[1]/n];
            drawEigenLine(v, getCol(i===0?"--vecA":"--vecB"));
            // 原始单位向量（灰细）
            drawArrowData({x:u[0],y:u[1]}, "rgba(100,116,139,0.65)", 2, null);
            // 经 A^k 缩放后的像（λ^k 倍）
            const lk=Math.pow(e.lambdas[i],k);
            const SUP="⁰¹²³⁴⁵⁶⁷⁸⁹";
            const exact=Math.abs(lk-Math.round(lk))<1e-9;
            drawArrowData({x:u[0]*lk,y:u[1]*lk}, getCol(i===0?"--vecA":"--vecB"), 3.4,
                          "λ"+(i===0?"₁":"₂")+(k>1?SUP[k]:"")+(exact?"=":"≈")+fmt(lk));
        }
    } else if(!e.real){
        // 无实特征值：只画网格
    } else if(e.repeated && !e.diagonalizable && e.vecs[0]){
        drawEigenLine(e.vecs[0], getCol("--vecA"));
        const v=e.vecs[0], n=Math.hypot(v[0],v[1]);
        if(n>1e-9){ const u=[v[0]/n,v[1]/n]; drawArrowData({x:u[0],y:u[1]}, getCol("--vecA"),3, "v"); }
    }
    if(!pr) renderDecomp(e);
}

function getCol(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim()||"#000"; }

/* ── MathML 小工具 ── */
function ratOf(x){ for(let q=1;q<=200;q++){ const p=Math.round(x*q); if(Math.abs(x-p/q)<1e-9){ const g=gcd(p,q)||1; return [p/g,q/g]; } } return null; }
function numML(x){            // 有理数写分数，否则写两位小数
    const r=ratOf(x);
    if(!r){ const t=fmt(x); return t.startsWith("-")?`<mo>&#x2212;</mo><mn>${t.slice(1)}</mn>`:`<mn>${t}</mn>`; }
    const sg=r[0]<0?`<mo>&#x2212;</mo>`:``, a=Math.abs(r[0]);
    return r[1]===1? `${sg}<mn>${a}</mn>` : `${sg}<mfrac><mn>${a}</mn><mn>${r[1]}</mn></mfrac>`;
}
function exactM(m){ return !APPROX && m.every(r=>r.every(x=>ratOf(x))); }
function rel(m){ return exactM(m)?`<mo>=</mo>`:`<mo>&#x2248;</mo>`; }
let APPROX=false;            // 当前矩阵特征值是否为无理数（为真时只写小数）
function decML(x){ const t=fmt(x); return t.startsWith("-")?`<mo>&#x2212;</mo><mn>${t.slice(1)}</mn>`:`<mn>${t}</mn>`; }
function matML(m){
    const f = APPROX? decML : numML;
    return `<math><mrow><mo>(</mo><mtable columnspacing="0.7em" rowspacing="0.2em">`
      +`<mtr><mtd>${f(m[0][0])}</mtd><mtd>${f(m[0][1])}</mtd></mtr>`
      +`<mtr><mtd>${f(m[1][0])}</mtd><mtd>${f(m[1][1])}</mtd></mtr>`
      +`</mtable><mo>)</mo></mrow></math>`;
}
function charEqML(T,D){       // λ² − Tλ + D = 0，符号与 0 项处理
    const sg=x=>x<0?"+":"&#x2212;";
    let h=`<math><msup><mi>&#x3BB;</mi><mn>2</mn></msup>`;
    if(Math.abs(T)>1e-9) h+=`<mo>${T>0?"&#x2212;":"+"}</mo>`+(Math.abs(Math.abs(T)-1)<1e-9?``:`<mn>${fmt(Math.abs(T))}</mn>`)+`<mi>&#x3BB;</mi>`;
    if(Math.abs(D)>1e-9) h+=`<mo>${D>0?"+":"&#x2212;"}</mo><mn>${fmt(Math.abs(D))}</mn>`;
    return h+`<mo>=</mo><mn>0</mn></math>`;
}
function drawPracticeNote(){
    const q=quiz; let t="";
    if(q.kind==="element") t = q.revealed? "网格为 A 作用下的像" : "已知：特征方向与 λ（揭晓后画出 A 的作用）";
    else t = q.revealed? "网格为 A 作用下的像；虚线为特征方向" : "网格为 A 作用下的像（揭晓后画出特征方向）";
    ctx.save(); ctx.font='12.5px "Segoe UI","Microsoft YaHei",system-ui'; ctx.fillStyle="#4a5568";
    ctx.lineJoin="round"; ctx.lineWidth=3; ctx.strokeStyle="rgba(255,255,255,.92)";
    ctx.strokeText(t,10,18); ctx.fillText(t,10,18); ctx.restore();
}
function vecML(v){
    return `<math><mrow><mo>(</mo><mtable rowspacing="0.2em">`
      +`<mtr><mtd><mn>${fmt(v[0])}</mn></mtd></mtr>`
      +`<mtr><mtd><mn>${fmt(v[1])}</mn></mtd></mtr>`
      +`</mtable><mo>)</mo></mrow></math>`;
}
function bmML(n){ return `<math><mi class="bm">${n}</mi></math>`; }

function renderDecomp(e){
    const el=document.getElementById("decompInfo");
    if(!e.real){
        el.innerHTML=`<div><span class="badge no">不可对角化</span></div>`
          +`<div class="eqnote">${e.reason}。左图只画出网格在 <math><msup><mi class="bm">A</mi><mi>k</mi></msup></math> 作用下的像。</div>`;
        return;
    }
    const l1=e.lambdas[0], l2=e.lambdas[1];
    APPROX = !(ratOf(l1)&&ratOf(l2));
    let html=`<div><span class="badge ${e.diagonalizable?'ok':'no'}">`
      +(e.diagonalizable?'可对角化':'不可对角化')+`</span></div>`;
    html+=`<div class="eqnote">特征值 <math><msub><mi>&#x3BB;</mi><mn>1</mn></msub>${ratOf(l1)?"<mo>=</mo>":"<mo>&#x2248;</mo>"}${numML(l1)}</math>`
      +`，<math><msub><mi>&#x3BB;</mi><mn>2</mn></msub>${ratOf(l2)?"<mo>=</mo>":"<mo>&#x2248;</mo>"}${numML(l2)}</math>`
      +(e.repeated?`（重根）`:``)+`</div>`;
    if(e.diagonalizable){
        const P=[[e.vecs[0][0],e.vecs[1][0]],[e.vecs[0][1],e.vecs[1][1]]];
        const Lam=[[l1,0],[0,l2]];
        const Pinv=matinv(P);
        html+=`<div class="mat-block">`
          +`<div class="mat-item"><div class="cap">${bmML("P")}（列=特征向量）</div>${matML(P)}</div>`
          +`<div class="mat-item"><div class="cap"><math><mi>&#x39B;</mi></math></div>${matML(Lam)}</div>`
          +`<div class="mat-item"><div class="cap"><math><msup><mi class="bm">P</mi><mrow><mo>&#x2212;</mo><mn>1</mn></mrow></msup></math></div>${matML(Pinv)}</div>`
          +`</div>`;
        const ex=exactM(P)&&exactM(Lam);
        if(!ex) html+=`<div class="eqnote" style="color:#744210;">特征值不是有理数，上面的 <math><mi class="bm">P</mi></math>、<math><mi>&#x39B;</mi></math>、<math><msup><mi class="bm">P</mi><mrow><mo>&#x2212;</mo><mn>1</mn></mrow></msup></math> 为保留两位小数的近似值（<math><mi class="bm">P</mi></math> 的列取第一个分量为 1）。</div>`;
        html+=`<div class="eqnote">验证 <math><mi class="bm">P</mi><mi>&#x39B;</mi>`
          +`<msup><mi class="bm">P</mi><mrow><mo>&#x2212;</mo><mn>1</mn></mrow></msup><mo>=</mo></math> ${(()=>{const sv=APPROX;APPROX=false;const h=matML(matmul(matmul(P,Lam),Pinv).map(r=>r.map(x=>Math.round(x*1e9)/1e9)));APPROX=sv;return h;})()}<math><mo>=</mo><mi class="bm">A</mi></math>${ex?"":"（按未取近似的 P、Λ 计算）"}</div>`;
        const Lk=[[Math.pow(l1,kPow),0],[0,Math.pow(l2,kPow)]];
        html+=`<div class="eqnote"><math><msup><mi class="bm">A</mi><mi>k</mi></msup><mo>=</mo>`
          +`<mi class="bm">P</mi><msup><mi>&#x39B;</mi><mi>k</mi></msup><msup><mi class="bm">P</mi><mrow><mo>&#x2212;</mo><mn>1</mn></mrow></msup></math>`
          +`，当前 <math><mi>k</mi><mo>=</mo><mn>${kPow}</mn></math>：<math><msup><mi>&#x39B;</mi><mi>k</mi></msup>${rel(Lk)}</math> ${matML(Lk)}，`
          +`故 <math>${kPow===1?`<mi class="bm">A</mi>`:`<msup><mi class="bm">A</mi><mn>${kPow}</mn></msup>`}<mo>=</mo></math> ${(()=>{const s=APPROX;APPROX=false;const h=matML(matpow(matrix,kPow));APPROX=s;return h;})()}</div>`;
        html+=`<div class="eqnote">几何意义：在特征向量基下，<math><mi class="bm">A</mi></math> 沿 `
          +`<math><msub><mi class="bm">v</mi><mn>1</mn></msub></math> 方向按 <math><msub><mi>&#x3BB;</mi><mn>1</mn></msub></math>、`
          +`沿 <math><msub><mi class="bm">v</mi><mn>2</mn></msub></math> 方向按 <math><msub><mi>&#x3BB;</mi><mn>2</mn></msub></math> 各自伸缩；左图灰色为特征方向上的单位向量，彩色为它在 <math><msup><mi class="bm">A</mi><mi>k</mi></msup></math> 作用下的像（<math><msup><mi>&#x3BB;</mi><mi>k</mi></msup></math> 倍）。</div>`;
    }else{
        html+=`<div class="mat-block dim">`
          +`<div class="mat-item"><div class="cap">${bmML("P")}</div><math><mo>—</mo></math></div>`
          +`<div class="mat-item"><div class="cap"><math><mi>&#x39B;</mi></math></div><math><mo>—</mo></math></div></div>`;
        html+=`<div class="eqnote">${e.reason}。仅有一个独立特征方向 ${e.vecs[0]?vecML(e.vecs[0]):''}，无法凑齐 2 个线性无关特征向量。</div>`;
    }
    el.innerHTML=html;
}

const QUIZKEY="la-diagonalize-quiz";
let streak=0;
let stats=loadStats();
function loadStats(){ try{ const s=JSON.parse(localStorage.getItem(QUIZKEY)); if(s&&typeof s.attempted==="number"){ streak=s.streak||0; return {attempted:s.attempted,correct:s.correct}; } }catch(e){} return {attempted:0,correct:0}; }
function saveStats(){ try{ localStorage.setItem(QUIZKEY, JSON.stringify({attempted:stats.attempted,correct:stats.correct,streak:streak})); }catch(e){} }

function ri(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

// 生成可对角化整数矩阵：P 取行列式=1 的整幺模阵，A=PΛP⁻¹ 必为整数
function genDiagMat(){
    let l1,l2; do{ l1=ri(-3,3); l2=ri(-3,3); }while(l1===l2);
    let p,q; do{ p=ri(-1,1); q=ri(-1,1); }while(p===0&&q===0);
    const P=[[1,p],[q,1+p*q]];              // det = 1
    const Pinv=[[1+p*q,-p],[-q,1]];
    const Lam=[[l1,0],[0,l2]];
    const A=matmul(matmul(P,Lam),Pinv).map(r=>r.map(Math.round));
    return {A,l1,l2,P,Pinv,Lam};
}

function genProblem(){
    const kind=["lambda","element","judge"][ri(0,2)];
    if(kind==="lambda"){
        const g=genDiagMat();
        return {kind, A:g.A, l1:g.l1, l2:g.l2, done:false,correct:false,revealed:false};
    }
    if(kind==="element"){
        const g=genDiagMat();
        const r=ri(0,1), c=ri(0,1);
        return {kind, P:g.P, Lam:g.Lam, A:g.A, r, c, ans:g.A[r][c],
                done:false,correct:false,revealed:false};
    }
    // judge：yes=可对角化 / no=二重特征值且只有一个线性无关特征向量
    if(Math.random()<0.5){
        const g=genDiagMat();
        return {kind:"judge", A:g.A, ansYes:true, why:"两个不同的实特征值，可对角化",
                done:false,correct:false,revealed:false,selected:-1};
    }else{
        // 二重特征值、只有一个线性无关特征向量：(l c; 0 l) 或其转置，c≠0
        const l=ri(-2,3), c=[-2,-1,1,2][ri(0,3)];
        const A = Math.random()<0.5 ? [[l,c],[0,l]] : [[l,0],[c,l]];
        return {kind:"judge", A, ansYes:false,
                why:"λ="+l+" 是二重特征值，但只有一个线性无关的特征向量，不可对角化",
                done:false,correct:false,revealed:false,selected:-1};
    }
}

          +`<div class="ans"><math><msub><mi class="bm">a</mi><mn>${q.r+1}${q.c+1}</mn></msub><mo>=</mo></math>`

function renderStats(){
    const acc = stats.attempted ? Math.round(stats.correct/stats.attempted*100) : 0;
    document.getElementById("quizStats").innerHTML=
        `已答 <b>${stats.attempted}</b> · 答对 <b>${stats.correct}</b> · 正确率 <b>${acc}%</b> · 连对 <b>${streak}</b>`;

function submitAnswer(){
    const q=quiz; if(!q||q.done) return;
    const fb=document.getElementById("qFeedback");
    if(q.kind==="lambda"){
        const a=parseFloat(document.getElementById("qL1").value);
        const b=parseFloat(document.getElementById("qL2").value);
        if(Number.isNaN(a)||Number.isNaN(b)){ fb.className="feedback no"; fb.textContent="请把两个特征值都填上"; return; }
        const ok=(near(a,q.l1)&&near(b,q.l2))||(near(a,q.l2)&&near(b,q.l1));
        if(ok) markCorrect(); else { fb.className="feedback no"; fb.textContent="还不对，再解一次特征方程～（也可以点“看解析”）"; }
    }else if(q.kind==="element"){
        const v=parseFloat(document.getElementById("qE").value);
        if(Number.isNaN(v)){ fb.className="feedback no"; fb.textContent="请填一个数"; return; }
        if(near(v,q.ans)) markCorrect(); else { fb.className="feedback no"; fb.textContent="还不对，注意先求 P⁻¹ 再连乘～"; }
    }else{
        if(q.selected<0){ fb.className="feedback no"; fb.textContent="请先选择一个选项"; return; }
        if((q.selected===1)===q.ansYes) markCorrect();
        else { fb.className="feedback no"; fb.textContent="不对哦，先看判别式与是否有重根～"; }
    }
}

function solHTML(){
    const q=quiz;
    if(q.kind==="lambda"){
        const T=q.A[0][0]+q.A[1][1], D=q.A[0][0]*q.A[1][1]-q.A[0][1]*q.A[1][0];
        return `<div class="sol">特征方程 ${charEqML(T,D)}`
          +`（<math><mi>tr</mi><mi class="bm">A</mi><mo>=</mo>${numML(T)}</math>，<math><mo>|</mo><mi class="bm">A</mi><mo>|</mo><mo>=</mo>${numML(D)}</math>），解得 <math><msub><mi>&#x3BB;</mi><mn>1</mn></msub><mo>=</mo>${numML(q.l1)}</math>、`
          +`<math><msub><mi>&#x3BB;</mi><mn>2</mn></msub><mo>=</mo>${numML(q.l2)}</math>。</div>`;
    }
    if(q.kind==="element"){
        const Pinv=matinv(q.P);
        return `<div class="sol"><math><mi class="bm">A</mi><mo>=</mo><mi class="bm">P</mi><mi>&#x39B;</mi>`
          +`<msup><mi class="bm">P</mi><mrow><mo>&#x2212;</mo><mn>1</mn></mrow></msup><mo>=</mo></math> `
          +`${matML(q.P)}${matML(q.Lam)}${matML(Pinv)}<math><mo>=</mo></math> ${matML(q.A)}，`
          +`第 (${q.r+1},${q.c+1}) 元素为 <b>${fmt(q.ans)}</b>。</div>`;
    }
    return `<div class="sol">正确答案：<b>${q.ansYes?'能对角化':'不能对角化'}</b>。${q.why}。</div>`;
}
function lockQ(){ ["qSubmit","qHint","qReveal"].forEach(id=>document.getElementById(id).disabled=true); }
function markCorrect(){
    const q=quiz; q.done=true; q.correct=true; q.revealed=true;
    stats.attempted++; stats.correct++; streak++; saveStats(); updateDisplay();
    const fb=document.getElementById("qFeedback");
    fb.className="feedback ok"; fb.innerHTML="✓ 正确！"+solHTML();
    lockQ(); renderStats();
}
function onReveal(){
    const q=quiz; if(!q||q.done) return;
    q.done=true; q.revealed=true; stats.attempted++; streak=0; saveStats(); updateDisplay();
    const fb=document.getElementById("qFeedback");
    fb.className="feedback"; fb.innerHTML=`<span class="no">已显示解析（本题记为未答对）</span>`+solHTML();
    lockQ(); renderStats();
}
function onHint(){
    const q=quiz; if(!q) return;
    const fb=document.getElementById("qFeedback"); fb.className="feedback";
    if(q.kind==="lambda"){
        fb.innerHTML=`提示：特征值满足 <math><msup><mi>&#x3BB;</mi><mn>2</mn></msup><mo>&#x2212;</mo>`
          +`<mo>(</mo><mi>tr</mi><mi class="bm">A</mi><mo>)</mo><mi>&#x3BB;</mi><mo>+</mo>`
          +`<mo>|</mo><mi class="bm">A</mi><mo>|</mo><mo>=</mo><mn>0</mn></math>（<math><mi>tr</mi><mi class="bm">A</mi></math> 为对角线元素之和）。`;
    }else if(q.kind==="element"){
        fb.innerHTML=`提示：先求 <math><msup><mi class="bm">P</mi><mrow><mo>&#x2212;</mo><mn>1</mn></mrow></msup></math>，再按矩阵连乘 <math><mi class="bm">P</mi><mi>&#x39B;</mi><msup><mi class="bm">P</mi><mrow><mo>&#x2212;</mo><mn>1</mn></mrow></msup></math> 取该位置的元素。`;
    }else{
        fb.innerHTML=`提示：算判别式 <math><msup><mrow><mo>(</mo><mi>tr</mi><mi class="bm">A</mi><mo>)</mo></mrow><mn>2</mn></msup><mo>&#x2212;</mo><mn>4</mn><mo>|</mo><mi class="bm">A</mi><mo>|</mo></math>：`
          +`大于 0，有两个不同的特征值 → 可以对角化；等于 0，是二重特征值 → 只有 <math><mi class="bm">A</mi><mo>=</mo><mi>&#x3BB;</mi><mi class="bm">E</mi></math> 时才可以。`;
    }
}
function nextProblem(){ quiz=genProblem(); renderProblem(); }

/* ── 模式切换 ── */
let savedExplore=null;
function setMode(m){
    mode=m;
    document.getElementById("btnExplore").classList.toggle("on",m==="explore");
    document.getElementById("btnPractice").classList.toggle("on",m==="practice");
    document.getElementById("exploreCard").style.display = m==="explore"?"":"none";
    document.getElementById("quizCard").style.display   = m==="practice"?"":"none";
    if(m==="practice"){
        savedExplore={M:matrix.map(r=>r.slice()), k:kPow};
        quiz=genProblem(); renderProblem();
    }else{
        if(savedExplore){
            matrix=savedExplore.M; kPow=savedExplore.k;
            document.getElementById("matA11").value=matrix[0][0];
            document.getElementById("matA12").value=matrix[0][1];
            document.getElementById("matA21").value=matrix[1][0];
            document.getElementById("matA22").value=matrix[1][1];
            document.getElementById("kSlider").value=kPow;
            document.getElementById("kVal").textContent=kPow;
        }
        quiz=null; updateDisplay();
    }
}
document.getElementById("btnExplore").addEventListener("click",()=>setMode("explore"));
document.getElementById("btnPractice").addEventListener("click",()=>setMode("practice"));
document.getElementById("qSubmit").addEventListener("click",submitAnswer);
document.getElementById("qHint").addEventListener("click",onHint);
document.getElementById("qReveal").addEventListener("click",onReveal);
document.getElementById("qNext").addEventListener("click",nextProblem);
document.getElementById("qReset").addEventListener("click",resetStats);

resize();
</script>
